<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Not Found | Abul Kalam Azad</title>
<meta name="description" content="The requested page could not be found.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0a0d12">
<meta name="color-scheme" content="dark">

<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
<link rel="stylesheet" href="/assets/css/style.css">

<style>
  .nf-wrap {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 32px 24px;
    position: relative;
    overflow: hidden;
  }
  .nf-bg { position: absolute; inset: 0; pointer-events: none; }
  .nf-bg .grid {
    position: absolute; inset: -1px;
    background-image:
      linear-gradient(to right,  rgba(148,180,200,.055) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(148,180,200,.055) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, #000 20%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, #000 20%, transparent 75%);
  }
  .nf-bg .glow {
    position: absolute; top: -220px; left: 50%;
    width: 760px; height: 520px; transform: translateX(-50%);
    background: radial-gradient(ellipse at center, rgba(69,214,196,.10), transparent 62%);
  }
  .nf-inner { position: relative; text-align: center; max-width: 620px; width: 100%; }
  .nf-code {
    font-family: var(--mono);
    font-size: clamp(3.4rem, 14vw, 6.5rem);
    font-weight: 700;
    letter-spacing: -.05em;
    line-height: 1;
    color: var(--accent);
    margin: 0 0 12px;
  }
  .nf-title { font-size: clamp(1.2rem, 4vw, 1.6rem); margin: 0 0 12px; letter-spacing: -.025em; }
  .nf-desc { color: var(--text-dim); font-size: .98rem; margin: 0 0 28px; }
  .nf-term { max-width: 460px; margin: 0 auto 30px; text-align: left; }
  .nf-actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  @media (max-width: 520px) { .nf-actions .btn { width: 100%; justify-content: center; } }
</style>
</head>
<body>
<main class="nf-wrap">
  <div class="nf-bg" aria-hidden="true"><span class="grid"></span><span class="glow"></span></div>

  <div class="nf-inner">
    <p class="nf-code">404</p>
    <h1 class="nf-title">Page not found</h1>
    <p class="nf-desc">That path doesn&rsquo;t resolve to anything on this site.</p>

    <div class="term nf-term" role="figure" aria-label="Command output">
      <div class="term-bar">
        <span class="term-dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="term-title mono">azad@sec: ~</span>
      </div>
      <div class="term-body mono">
        <p class="line"><span class="prompt" aria-hidden="true">$</span>curl -I <span id="nf-path">.</span></p>
        <p class="out">HTTP/2 404 &mdash; No such resource.</p>
      </div>
    </div>

    <div class="nf-actions">
      <a class="btn btn-primary" href="/">Back to home</a>
      <a class="btn btn-outline" href="/#projects">Security work</a>
      <a class="btn btn-outline" href="/#contact">Contact</a>
    </div>
  </div>
</main>

<script src="/assets/js/404.js" defer></script>
</body>
</html>
